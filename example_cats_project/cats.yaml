# Example configuration: replace the account ID and the two SSM parameter names with your own.

cats_deployment_settings:
  allow_deploy_to_current_account: true
  parent_account_id: "123456789012"
  aws_region: eu-west-1
  cfn_stack_prefix: "CATS-example-"

global_network_settings:
  udp_listen_ports: [5000]
  tcp_listen_ports: [8080]
  ec2_instance_type: t3.micro
  gateway_endpoints:
    - S3

accounts_under_test:
  myaccount:
    account_id: "123456789012"
    account_network_under_test:
      private:
        vpc_id: /cats/integ-test/vpc-id
        subnet_ids:
          - /cats/integ-test/subnet-id
