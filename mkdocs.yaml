site_name: "CATS: Control Acceptance Testing Suite"
site_url: https://awslabs.github.io/cats/
use_directory_urls: false
repo_url: https://github.com/awslabs/cats
repo_name: "awslabs/cats"
# No edit_uri: the repository does not take contributions through GitHub edits.
edit_uri: ""
theme:
  name: material
  custom_dir: overrides
  # No third-party requests from the docs: Material would otherwise load Roboto from Google Fonts on every page.
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/toggle-switch-off
        name: Switch to light mode
  features:
    - content.code.annotate
    - content.code.copy
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
  icon:
    logo: material/cat
    repo: fontawesome/brands/github
hooks:
  - overrides/hooks/publish_schema.py
plugins:
  - search
  - awesome-pages
  - mkdocstrings:
      handlers:
        python:
          options:
            extensions:
              - griffe_pydantic:
                  schema: true

markdown_extensions:
  - toc
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - mdx_truly_sane_lists
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde

extra_css:
  - stylesheets/extra.css
  # Homepage, one file per section (the markup is in overrides/partials/home/)
  - stylesheets/home/layout.css
  - stylesheets/home/hero.css
  - stylesheets/home/summary.css
  - stylesheets/home/terminal.css
  - stylesheets/home/flip-cards.css
  - stylesheets/home/code-evidence.css
  - stylesheets/home/next-steps.css
  - stylesheets/home/reveal.css

extra_javascript:
  # Homepage behaviour: index.js imports one module per feature
  - path: javascripts/home/index.js
    type: module
