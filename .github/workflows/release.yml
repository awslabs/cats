name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

# One release pipeline at a time, never cancelled: two `v*` tags pushed close together (a
# mis-tag and its correction) would otherwise run two publishes to the `pypi` approval at once.
concurrency:
  group: release
  cancel-in-progress: false

env:
  UV_VERSION: "0.11.28"

# Three jobs, by privilege. `test` and `build` hold `contents: read` only: they resolve packages
# from PyPI (uv sync, twine, the smoke test's clean venv), so nothing they run can reach the
# OIDC token. `publish` holds `id-token: write` and runs nothing but the pinned publish action
# on the artifact `build` handed over.
jobs:
  test:
    name: Unit tests
    # Forks must not run a doomed publish pipeline.
    if: github.repository == 'awslabs/cats'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: false
      - run: uv sync --locked
      - run: uv run pytest tests/unit_tests/ -n 4

  build:
    name: Build and check the artifact
    needs: test
    if: github.repository == 'awslabs/cats'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The ancestry check needs main's history, not just the tagged commit.
          fetch-depth: 0

      # A tag can point at any commit; only one on main is a release. (This proves the commit
      # is on main, not that CI passed on it: the `test` job above is the test gate.)
      - name: Check the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main" >&2
            exit 1
          fi

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: false

      - name: Check tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${TAG#v}" != "${VERSION}" ]; then
            echo "Tag ${TAG} does not match pyproject.toml version ${VERSION}" >&2
            exit 1
          fi

      - name: Build
        run: uv build

      # Keep in step with the artifact-smoke job in ci.yml. `uv run --no-project` so the smoke
      # test's clean venv is built from the interpreter setup-uv selected, not the runner's `python`.
      - name: Check the artifact
        run: |
          uvx twine==7.0.0 check dist/*
          uv run --no-project python tests/artifact_smoke.py dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: github.repository == 'awslabs/cats'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC token for PyPI trusted publishing; this job runs no project code
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
