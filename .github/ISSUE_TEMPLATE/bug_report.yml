name: Bug report
description: CATS did something other than what its documentation says it does.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security issues here; follow [SECURITY.md](https://github.com/awslabs/cats/blob/main/SECURITY.md).
        Remove account IDs, role ARNs, hostnames and credentials from anything you paste.
  - type: input
    id: version
    attributes:
      label: CATS version
      description: Output of `cats --version`. If a deployed stack is involved, `cats infra status` shows the version that deployed it.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command or test you ran, what CATS reported, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant cats.yaml
      description: The parts of the config involved, with identifiers replaced by placeholders.
      render: yaml
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The failing output. For a network probe, the `result`, `reason` and `http_status` CATS returned.
      render: text
